name: Tooltip diagnostic
on:
  push:
    branches: [codex/windowless-containers]
permissions:
  contents: read
jobs:
  tooltip:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish the app and build the GUI checker
        shell: pwsh
        run: |
          dotnet publish src -c Release -r win-x64 --self-contained false -o tooltip-app
          if ($LASTEXITCODE) { throw 'app build failed' }
          dotnet build tests/HomePodCast.GuiSmoke -c Release
          if ($LASTEXITCODE) { throw 'GUI checker build failed' }
      - name: Check light and dark tooltip
        shell: pwsh
        run: |
          ./tests/HomePodCast.GuiSmoke/bin/Release/net10.0-windows/HomePodCast.GuiSmoke.exe --app tooltip-app/HomePodCast.exe --only idle-zh-CN-100 --out tooltip-evidence
          if ($LASTEXITCODE) { throw 'tooltip checks failed' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tooltip-evidence
          path: tooltip-evidence
