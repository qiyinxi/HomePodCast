# TEMPORARY experiment (claude/uia-cache-race), removed before the PR is final: how often does the UIA bulk cache
# response break after the room-file picker closes, with the dev app (parent-painted text with its own UIA
# fragment provider) and with the 1.2.0 release (no custom UIA provider)? Fresh runners, each restarting the app.
name: UIA race (temporary)

on:
  push:
    branches: ['claude/uia-cache-race']

permissions:
  contents: read
  actions: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  stress:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [dev, v120]
        language: [zh-CN, da, en, es, de, fi, fr, ja, nl, pl]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Get the app
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory packages | Out-Null
          if ('${{ matrix.variant }}' -eq 'dev') { gh run download 39302819028 -n packages -D packages -R $env:GITHUB_REPOSITORY }
          else { gh release download v1.2.0 -p '*-win-x64.zip' -p 'HomePodCast-video-window-*.zip' -D packages -R $env:GITHUB_REPOSITORY }
          $zip = @(Get-ChildItem packages -Filter '*-win-x64.zip')
          if ($zip.Count -ne 1) { throw "expected one -win-x64.zip, found $($zip.Count)" }
          Expand-Archive $zip[0].FullName -DestinationPath smoke-app
          $module = @(Get-ChildItem packages -Filter 'HomePodCast-video-window-*.zip')
          Expand-Archive $module[0].FullName -DestinationPath smoke-video-window
          (Get-Item smoke-app/HomePodCast.exe).VersionInfo.ProductVersion

      - name: Build the smoke test
        run: dotnet build tests/HomePodCast.GuiSmoke -c Release

      - name: Room-file stress
        shell: pwsh
        env:
          GUI_UIA_PROBE: '1'
          GUI_ROOM_STRESS_MINUTES: '6'
          GUI_SCENARIO_MINUTES: '14'
        run: |
          ./tests/HomePodCast.GuiSmoke/bin/Release/net10.0-windows/HomePodCast.GuiSmoke.exe --app smoke-app/HomePodCast.exe --video-window smoke-video-window --out out --only group-outputs-${{ matrix.language }}-150
          "exit $LASTEXITCODE"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stress-${{ matrix.variant }}-${{ matrix.language }}
          path: out
          if-no-files-found: warn

  full:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Get the app
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39302819028 -n packages -D packages -R $env:GITHUB_REPOSITORY
          $zip = @(Get-ChildItem packages -Filter '*-win-x64.zip')
          Expand-Archive $zip[0].FullName -DestinationPath smoke-app
          $module = @(Get-ChildItem packages -Filter 'HomePodCast-video-window-*.zip')
          Expand-Archive $module[0].FullName -DestinationPath smoke-video-window

      - name: Build the smoke test
        run: dotnet build tests/HomePodCast.GuiSmoke -c Release

      - name: GUI group-output test with the probe
        shell: pwsh
        env:
          GUI_UIA_PROBE: '1'
        run: |
          ./tests/HomePodCast.GuiSmoke/bin/Release/net10.0-windows/HomePodCast.GuiSmoke.exe --app smoke-app/HomePodCast.exe --video-window smoke-video-window --out out --only group-outputs --shard ${{ matrix.shard }}/5
          "exit $LASTEXITCODE"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-${{ matrix.shard }}
          path: out
          if-no-files-found: warn
