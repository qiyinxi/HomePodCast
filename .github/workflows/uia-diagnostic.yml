name: UIA diagnostic

# Temporary focused reproduction. Normal build.yml still runs its complete, unchanged matrix.
on:
  pull_request:
    paths: ['.github/workflows/uia-diagnostic.yml']

permissions:
  contents: read
  actions: read

jobs:
  focused-gui:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Publish the current app with the release packaging options
        shell: pwsh
        run: |
          dotnet publish src/HomePodCast.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:Version=1.2.0-pr.78.999 -o diagnostic-app
          if ($LASTEXITCODE) { throw 'Publish failed.' }
          ./tools/build-video-window.ps1 -Version '1.2.0-pr.78.999'
      - name: Download the native exception monitor
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true') { throw 'CI only.' }
          Invoke-WebRequest https://download.sysinternals.com/files/Procdump.zip -OutFile procdump.zip
          Expand-Archive procdump.zip -DestinationPath diagnostic-tools
      - name: Build GUI client
        run: dotnet build tests/HomePodCast.GuiSmoke -c Release
      - name: Reproduce one language
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true') { throw 'CI only.' }
          New-Item uia-diagnostics/dumps -ItemType Directory -Force | Out-Null
          $monitor = Start-Process diagnostic-tools/procdump64.exe -WindowStyle Hidden -PassThru -ArgumentList @('-accepteula', '-ma', '-e', '1', '-g', '-f', 'C00000FD', '-n', '1', '-w', 'HomePodCast.exe', 'uia-diagnostics/dumps') -RedirectStandardOutput uia-diagnostics/procdump.txt -RedirectStandardError uia-diagnostics/procdump-error.txt
          try {
            ./tests/HomePodCast.GuiSmoke/bin/Release/net10.0-windows/HomePodCast.GuiSmoke.exe --app diagnostic-app/HomePodCast.exe --video-window publish/video-window --out uia-diagnostics --only group-outputs-zh-CN-150
            $result = $LASTEXITCODE
            $monitor.WaitForExit(30000) | Out-Null
            if ($result) { throw 'Focused GUI reproduction failed; inspect the artifact.' }
          } finally {
            if (!$monitor.HasExited) { Stop-Process -Id $monitor.Id }
          }
      - name: Capture application events
        if: always()
        shell: pwsh
        run: |
          New-Item uia-diagnostics -ItemType Directory -Force | Out-Null
          Start-Sleep -Seconds 3
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-15)} -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in @('.NET Runtime', 'Application Error', 'Windows Error Reporting') } |
            Select-Object TimeCreated, ProviderName, Id, Message | Format-List |
            Out-File uia-diagnostics/application-events.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: uia-diagnostics
          path: uia-diagnostics
