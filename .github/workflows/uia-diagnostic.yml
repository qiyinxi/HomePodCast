name: UIA diagnostic

# Temporary focused reproduction. Normal build.yml still runs its complete, unchanged matrix.
on:
  pull_request:
    paths: ['.github/workflows/uia-diagnostic.yml']

permissions:
  contents: read
  actions: read

jobs:
  focused-gui:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/download-artifact@v7
        with:
          name: packages
          run-id: 39126789136
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: diagnostic-packages
      - name: Use the exact failing app and module
        shell: pwsh
        run: |
          $app = @(Get-ChildItem diagnostic-packages -Filter '*-win-x64.zip')
          $module = @(Get-ChildItem diagnostic-packages -Filter 'HomePodCast-video-window-*.zip')
          if ($app.Count -ne 1 -or $module.Count -ne 1) { throw 'Expected app and module packages.' }
          Expand-Archive $app[0].FullName -DestinationPath diagnostic-app
          Expand-Archive $module[0].FullName -DestinationPath diagnostic-module
      - name: Enable crash dumps on this disposable CI runner
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true') { throw 'CI only.' }
          $folder = Join-Path $env:GITHUB_WORKSPACE 'uia-diagnostics/dumps'
          New-Item $folder -ItemType Directory -Force | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\HomePodCast.exe'
          New-Item $key -Force | Out-Null
          New-ItemProperty $key -Name DumpFolder -Value $folder -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty $key -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null
          New-ItemProperty $key -Name DumpCount -Value 1 -PropertyType DWord -Force | Out-Null
      - name: Build GUI client
        run: dotnet build tests/HomePodCast.GuiSmoke -c Release
      - name: Reproduce one language
        shell: pwsh
        run: |
          ./tests/HomePodCast.GuiSmoke/bin/Release/net10.0-windows/HomePodCast.GuiSmoke.exe --app diagnostic-app/HomePodCast.exe --video-window diagnostic-module --out uia-diagnostics --only group-outputs-zh-CN-150
          if ($LASTEXITCODE) { throw 'Focused GUI reproduction failed; inspect the artifact.' }
      - name: Capture application events
        if: always()
        shell: pwsh
        run: |
          New-Item uia-diagnostics -ItemType Directory -Force | Out-Null
          Start-Sleep -Seconds 3
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-15)} -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in @('.NET Runtime', 'Application Error', 'Windows Error Reporting') } |
            Select-Object TimeCreated, ProviderName, Id, Message | Format-List |
            Out-File uia-diagnostics/application-events.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: uia-diagnostics
          path: uia-diagnostics
