name: build

on:
  push:
    branches: [main, dev, 'release/**']
    tags: ['v*']
  pull_request:
    branches: [main, dev, 'release/**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read # the release checks of tag builds look up this workflow's branch runs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Tag builds only, before anything slow (docs/RELEASING.md): the tag is vX.Y.Z, -beta.N or -rc.N of the csproj
      # <Version>; its commit has already passed this workflow on a push to dev, main or release/**; and a stable tag
      # is on main with exactly the source tree of a published beta. Everything is read through the GitHub API.
      - name: Release checks
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/release-checks.ps1 -Tag $env:GITHUB_REF_NAME -Sha $env:GITHUB_SHA -Repo $env:GITHUB_REPOSITORY -ExcludeRunId $env:GITHUB_RUN_ID

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Version
        id: ver
        shell: pwsh
        run: |
          # tag v1.2.3 -> 1.2.3; PR -> X.Y.Z-pr.<n>.<run>; branch -> X.Y.Z-<branch>.<run>, X.Y.Z = <Version> in
          # src/HomePodCast.csproj (a tag's version is checked against it in "Release checks"). So a PR or branch build is a
          # prerelease of the version it is working on, and its MSI is X.Y.Z.<run> (installer/build.ps1), which upgrades
          # every published release up to X.Y.Z: msi-e2e tests those as real upgrades. The MSIX gets X.Y.Z.0 either way
          # (packaging/msix/build.ps1).
          if ((Get-Content src/HomePodCast.csproj -Raw) -notmatch '<Version>\s*(\d+\.\d+\.\d+)\s*</Version>') { throw 'src/HomePodCast.csproj has no <Version>X.Y.Z</Version>' }
          $base = $Matches[1]
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') }
               elseif ('${{ github.event_name }}' -eq 'pull_request') { "$base-pr.${{ github.event.number }}.${{ github.run_number }}" }
               else { "$base-" + ('${{ github.ref_name }}' -replace '[^A-Za-z0-9]', '-') + '.${{ github.run_number }}' }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version $v"

      - name: Build
        run: dotnet build src -c Release -p:Version=${{ steps.ver.outputs.version }}

      - name: Unit tests
        run: dotnet test tests/HomePodCast.Tests -c Release --logger "trx;LogFileName=results.trx" --results-directory test-results

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results

      - name: Check browser extension
        if: hashFiles('extension/manifest.json') != ''
        shell: pwsh
        run: |
          Get-Content extension/manifest.json -Raw | ConvertFrom-Json | Out-Null
          Get-ChildItem extension -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE) { throw "syntax error in $($_.FullName)" }
          }
          node --test (Get-ChildItem extension/test -Filter *.test.js).FullName
          if ($LASTEXITCODE) { throw 'browser extension tests failed' }

      - name: Check Python tools
        shell: pwsh
        run: |
          Get-ChildItem tools, tests/vectors -Recurse -Filter *.py | ForEach-Object {
            python -m py_compile $_.FullName
            if ($LASTEXITCODE) { throw "syntax error in $($_.FullName)" }
          }

      # The decisions of tools/release.ps1 -Beta (snapshot branches, docs/RELEASING.md), offline.
      - name: Check release script
        shell: pwsh
        run: ./tools/release.ps1 -SelfTest

      # The process helpers of tools/ci/update-e2e.ps1 (path comparison, waiting for a starting process's image path)
      # against fake process snapshots, offline: it installs and starts nothing here.
      - name: Check update e2e helpers
        shell: pwsh
        run: ./tools/ci/update-e2e.ps1 -SelfTest

      - name: Publish (framework-dependent, single file)
        run: >
          dotnet publish src/HomePodCast.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:Version=${{ steps.ver.outputs.version }} -o publish/HomePodCast

      # The synchronized viewing window (modules/VideoWindow, experimental since 1.1), its own zip: --self-test runs
      # its GPU path (scaling up to 8K, WinRT surface interop) on WARP, without a window or a capture.
      - name: Publish the viewing window module and test its GPU path
        shell: pwsh
        run: ./tools/build-video-window.ps1 -Version '${{ steps.ver.outputs.version }}'

      # Code signing via SignPath Foundation (https://signpath.org) — enable once the project is approved
      # and the SIGNPATH_API_TOKEN secret plus the organization/project/policy ids are known.
      # - name: Upload unsigned exe
      #   id: unsigned
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: unsigned
      #     path: publish/HomePodCast/HomePodCast.exe
      # - name: Sign with SignPath
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: '<organization id>'
      #     project-slug: 'HomePodCast'
      #     signing-policy-slug: 'release-signing'
      #     github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: publish/HomePodCast
      # The MSI below packs the exe from publish/HomePodCast, so it picks up the signed one. The MSI itself
      # needs a second signing request after "Build MSI" (upload publish/*.msi as an artifact, submit it the
      # same way with output-artifact-directory: publish) before the "Upload packages" step. Sign it only
      # after build.ps1 has finished: the script embeds the language transforms into the file at the end.

      - name: Restore .NET tools (WiX)
        run: dotnet tool restore

      # One MSI for all wizard languages: build.ps1 builds a package per culture (installer/i18n/*.wxl) and
      # embeds each one as a language transform in the en-US package. -Validate runs the ICE checks on every
      # package and checks that each embedded transform reproduces its culture's package exactly.
      - name: Build MSI
        shell: pwsh
        run: ./installer/build.ps1 -Version '${{ steps.ver.outputs.version }}' -Build ${{ github.run_number }} -Validate

      - name: Package
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          Copy-Item LICENSE, README*.md publish/HomePodCast/
          Compress-Archive -Path publish/HomePodCast/* -DestinationPath "publish/HomePodCast-$v-win-x64.zip"
          Compress-Archive -Path publish/video-window/* -DestinationPath "publish/HomePodCast-video-window-$v.zip"
          if (Test-Path extension/manifest.json) {
            Compress-Archive -Path (Get-Item extension/manifest.json, extension/src, extension/_locales, extension/icons -ErrorAction SilentlyContinue) -DestinationPath "publish/HomePodCast-extension-$v.zip"
          }

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            publish/*.zip
            publish/*.msi
          if-no-files-found: error

      # Microsoft Store package (packaging/msix/README.md): self-contained, since the Store doesn't install the .NET
      # runtime, and unsigned, since the Store signs what it publishes. It is a workflow artifact only and never goes
      # on a GitHub release: an unsigned MSIX doesn't install anywhere else. build.ps1's defaults are the identity
      # Partner Center assigned to the reserved name; the repository variables override them when set.
      - name: Build MSIX
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $identity = @{}
          if ($env:MSIX_IDENTITY_NAME) { $identity.IdentityName = $env:MSIX_IDENTITY_NAME }
          if ($env:MSIX_PUBLISHER) { $identity.Publisher = $env:MSIX_PUBLISHER }
          if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $identity.PublisherDisplayName = $env:MSIX_PUBLISHER_DISPLAY_NAME }
          ./packaging/msix/build.ps1 -Version '${{ steps.ver.outputs.version }}' @identity

      - name: Upload MSIX
        uses: actions/upload-artifact@v7
        with:
          name: msix
          path: publish/*.msix
          if-no-files-found: error

  # The MSI install's in-app update (设置 → 软件更新 「更新」), end to end, on every build: an older MSI built from this
  # source (0.0.1-e2e.1, never uploaded) is installed, then its `update-selftest` command runs the button's code against a
  # fake release list on 127.0.0.1 that offers this build's MSI: download, SHA-256 (a corrupted copy must be refused),
  # helper, msiexec through Verb runas, the new version started again with --updated-from=, in the default and in a
  # custom folder. Nothing goes to GitHub. The UAC dialog itself is the part only a person sees (tools/ci/update-e2e.ps1).
  update-e2e:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      - name: Update end to end
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: ./tools/ci/update-e2e.ps1 -NewMsi "packages/HomePodCast-$env:VERSION-x64.msi" -NewVersion $env:VERSION

      - name: Upload update e2e logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: update-e2e-logs
          path: ${{ runner.temp }}/update-e2e/logs
          if-no-files-found: ignore

  # The Microsoft Store package installed and run on the runner (docs/device-test-checklist.zh-CN.md 「Microsoft Store 版」,
  # packaging/msix/e2e-test.ps1): a copy of the msix artifact signed with a throwaway certificate (the artifact stays
  # unsigned) is installed and started the way Start does; then package identity, the log in the package's storage,
  # no GitHub contact, the manifest's firewall rules, the startup task (through the app's own `autostart` command),
  # the single-instance lock against a second start and the MSI build, and a clean uninstall. Nothing connects: the
  # test settings have no speaker and automatic connect off. Windows PowerShell for the Appx module.
  msix-e2e:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The MSI build is framework-dependent: its launch condition and the exe want the .NET 10 Desktop Runtime.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v8
        with:
          name: msix
          path: msix

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      - name: Install, run and uninstall the MSIX
        shell: powershell
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: ./packaging/msix/e2e-test.ps1 -Msix "msix/HomePodCast-$env:VERSION-x64.msix" -Msi "packages/HomePodCast-$env:VERSION-x64.msi" -OutDir msix-e2e

      - name: Upload the app's log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msix-e2e-logs
          path: |
            msix-e2e/*.log
          if-no-files-found: ignore

  # End-to-end test of the MSI on the runner (tools/ci/msi-e2e.ps1; docs/device-test-checklist.zh-CN.md 「安装包（MSI）」):
  # silent install into the default and a custom folder (files, Start menu shortcut, one Programs and Features entry, the
  # firewall rule, which the installed exe's own startup check must accept), uninstall (all gone, %APPDATA%\HomePodCast
  # kept), upgrades from published releases (gh release download), a refused downgrade, and the embedded wizard
  # languages. The release job needs it: a tag whose installer is broken is never published.
  msi-e2e:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The MSI's launch condition wants the .NET 10 Desktop Runtime (x64) in C:\Program Files\dotnet; the SDK brings it.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      - name: MSI end-to-end test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = @(Get-ChildItem packages -Filter *.msi)
          if ($msi.Count -ne 1) { throw "expected one .msi in the packages artifact, found $($msi.Count)" }
          ./tools/ci/msi-e2e.ps1 -Msi $msi[0].FullName

      - name: Upload msiexec logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: msi-e2e-logs
          path: ${{ runner.temp }}/msi-e2e/logs


  # The browser extension in a real Chromium (extension/test/e2e): the unpacked extension against local stand-ins for a
  # YouTube and a bilibili player (also its WASM <bwp-video>) and a bare <video>, with a fake HomePodCast API that the
  # tests switch between streaming, idle and not running. Nothing leaves the runner (no real site; host names other than
  # *.localhost don't resolve). Checks the in-page controls, sync fullscreen, ±5/±20 ms and the Alt shortcuts, the delayed picture by the
  # frame numbers it shows, and the popup; see docs/device-test-checklist.zh-CN.md for what stays manual.
  extension-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extension/test/e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/test/e2e/package-lock.json

      # ffmpeg makes the test video; Ubuntu 24.04 keeps Chromium's sandbox from user namespaces unless this is off.
      - name: Prepare the runner
        run: |
          command -v ffmpeg || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg; }
          userns=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$userns" ]; then echo 0 | sudo tee "$userns"; fi

      - name: Install Puppeteer (and its Chrome for Testing)
        run: npm ci --no-audit --no-fund

      - name: Browser tests
        run: npm test

      - name: Upload screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: extension-e2e-screenshots
          path: extension/test/e2e/artifacts
          if-no-files-found: ignore

  # GUI smoke test (tests/HomePodCast.GuiSmoke, docs/RELEASING.md): the Release exe of the build job, started with test
  # configs on the runner's desktop and walked through UI Automation: every page scrolled through, the tray flyout and
  # the dialogs (全局快捷键, 使用配置, 多音箱, 设置 → 音箱信息), in Chinese, English and German, at 100 % (also at the
  # window's minimum width) and 150 % scale, idle, waiting to retry a speaker that doesn't answer, and connected to the
  # tests' fake HomePod on 127.0.0.1. Fails on a crash, an ERROR in the log, a window that doesn't appear, clipped or
  # overlapping controls, unnamed buttons or untranslated text. Also the synchronized viewing window from this build's
  # module zip: started from Settings, then on its own with generated 4K pictures through its GPU queue and swap chain
  # (never the window picker or a capture). Every screenshot is in the gui-screenshots artifact (index.html), for a look
  # through before a release.
  gui-smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      - name: Unpack the app
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem packages -Filter '*-win-x64.zip')
          if ($zip.Count -ne 1) { throw "expected one -win-x64.zip, found $($zip.Count)" }
          Expand-Archive $zip[0].FullName -DestinationPath smoke-app
          $module = @(Get-ChildItem packages -Filter 'HomePodCast-video-window-*.zip')
          if ($module.Count -ne 1) { throw "expected one HomePodCast-video-window-*.zip, found $($module.Count)" }
          Expand-Archive $module[0].FullName -DestinationPath smoke-video-window

      - name: Build the smoke test
        run: dotnet build tests/HomePodCast.GuiSmoke -c Release

      - name: Check the smoke-test matrix
        shell: pwsh
        run: |
          ./tests/HomePodCast.GuiSmoke/bin/Release/net10.0-windows/HomePodCast.GuiSmoke.exe --selftest
          if ($LASTEXITCODE) { throw 'GUI smoke-test matrix selftest failed' }

      - name: GUI smoke test
        shell: pwsh
        run: |
          ./tests/HomePodCast.GuiSmoke/bin/Release/net10.0-windows/HomePodCast.GuiSmoke.exe --app smoke-app/HomePodCast.exe --video-window smoke-video-window --out gui-screenshots --only baseline
          if ($LASTEXITCODE) { throw 'GUI smoke test failed: see the job summary, and the gui-screenshots artifact (index.html)' }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-screenshots
          path: gui-screenshots
          if-no-files-found: warn

  # Each supported language has a required 150 % group-output run. Partition the harness's generated list rather
  # than maintaining language lists here, so every language is checked once without exhausting one desktop's job.
  gui-output-groups:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      - name: Unpack the app
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem packages -Filter '*-win-x64.zip')
          if ($zip.Count -ne 1) { throw "expected one -win-x64.zip, found $($zip.Count)" }
          Expand-Archive $zip[0].FullName -DestinationPath smoke-app
          $module = @(Get-ChildItem packages -Filter 'HomePodCast-video-window-*.zip')
          if ($module.Count -ne 1) { throw "expected one HomePodCast-video-window-*.zip, found $($module.Count)" }
          Expand-Archive $module[0].FullName -DestinationPath smoke-video-window

      - name: Build the smoke test
        run: dotnet build tests/HomePodCast.GuiSmoke -c Release

      - name: GUI group-output test
        shell: pwsh
        run: |
          ./tests/HomePodCast.GuiSmoke/bin/Release/net10.0-windows/HomePodCast.GuiSmoke.exe --app smoke-app/HomePodCast.exe --video-window smoke-video-window --out gui-output-groups-${{ matrix.shard }} --only group-outputs --shard ${{ matrix.shard }}/5
          if ($LASTEXITCODE) { throw 'GUI group-output test failed: see the job summary and the gui-output-groups-${{ matrix.shard }} artifact (index.html)' }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-output-groups-${{ matrix.shard }}
          path: gui-output-groups-${{ matrix.shard }}
          if-no-files-found: warn

  aac-fixture:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Encode synthetic AAC with Windows Media Foundation
        run: dotnet run --project tests/HomePodCast.ProtocolHarness -c Release -- --aac-fixture test-results/aac-fixture
      - name: Encode DLNA AAC ADTS and MP3 with production codecs
        run: dotnet run --project tests/HomePodCast.ProtocolHarness -c Release -- --dlna-codec-fixture test-results/dlna-codec-fixture
      - uses: actions/upload-artifact@v7
        with:
          name: aac-fixture
          path: test-results/aac-fixture
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: dlna-codec-fixture
          path: test-results/dlna-codec-fixture
          if-no-files-found: error

  airplay-compat-e2e:
    needs: aac-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: AirPlay compatibility receiver test
        run: bash tools/ci/airplay-compat-e2e.sh
      - uses: actions/download-artifact@v8
        with:
          name: aac-fixture
          path: test-results/aac-fixture
      - name: AirPlay 2 realtime and buffered receiver tests
        run: |
          set -o pipefail
          if ! bash tools/ci/airplay2-compat-e2e.sh 2>&1 | tee test-results/airplay-compat/airplay2-build.log; then
            {
              echo '### AirPlay 2 receiver build or session failure'
              echo '```text'
              tail -n 160 test-results/airplay-compat/airplay2-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload receiver diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: airplay-compat-results
          path: test-results/airplay-compat
          if-no-files-found: warn

  # The production SSDP/SOAP/HTTP sender against pinned, unmodified gmrender-resurrect.
  # Its only sink is a PCM file. Both peers live in namespaces with no host/LAN uplink.
  dlna-compat-e2e:
    needs: aac-fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v8
        with:
          name: dlna-codec-fixture
          path: test-results/dlna-codec-fixture
      - name: DLNA compatibility renderer test
        run: |
          mkdir -p test-results/dlna-compat
          set -o pipefail
          if ! bash tools/ci/dlna-compat-e2e.sh 2>&1 | tee test-results/dlna-compat/build.log; then
            {
              echo '### DLNA software renderer failure'
              echo '```text'
              tail -n 160 test-results/dlna-compat/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload DLNA renderer diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dlna-compat-results
          path: test-results/dlna-compat
          if-no-files-found: warn

  release:
    needs: [build, update-e2e, msix-e2e, msi-e2e, extension-e2e, gui-smoke, gui-output-groups, aac-fixture, airplay-compat-e2e, dlna-compat-e2e]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      - uses: softprops/action-gh-release@v3
        with:
          name: HomePodCast ${{ needs.build.outputs.version }}
          files: |
            packages/*.zip
            packages/*.msi
          generate_release_notes: true
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}

  # Microsoft Store submission of the MSIX for stable tags (no '-' in the version); beta tags stay on GitHub.
  # Dormant: enable it once all of this exists (packaging/msix/README.md has the steps):
  #   - HomePodCast is live in the Store from a first submission made by hand in Partner Center (listing,
