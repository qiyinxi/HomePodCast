version: 2
updates:
  # Updates land on dev like any other change; they reach main with the next verified merge.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directories:
      - /src
      - /tests/HomePodCast.Tests
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      test-tools:
        patterns: ['xunit*', 'Microsoft.NET.Test.Sdk', 'coverlet*']
