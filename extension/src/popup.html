<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>HomePodCast 视频同步</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>HomePodCast 视频同步</h1>

    <section class="card status" id="statusCard" data-state="unknown">
      <span class="dot" aria-hidden="true"></span>
      <span id="statusText">正在连接…</span>
    </section>

    <section class="card site" id="siteCard">
      <div class="row">
        <span class="label">当前网站</span>
        <span id="host" class="host">—</span>
      </div>
      <div class="delay">
        <button type="button" id="minus" class="step" aria-label="减少 1 毫秒" title="减少 1 毫秒（按住连续调整）">−</button>
        <div class="value" aria-live="polite">
          <span id="effDelay">—</span><span class="unit">ms</span>
          <div class="caption">画面延迟</div>
        </div>
        <button type="button" id="plus" class="step" aria-label="增加 1 毫秒" title="增加 1 毫秒（按住连续调整）">+</button>
      </div>
      <div class="row sub">
        <span>网站偏移 <b id="offset">+0 ms</b></span>
        <button type="button" id="reset" class="link">重置</button>
      </div>
      <p class="hint" id="hint" hidden></p>
      <label class="row toggle">
        <span>在此网站启用</span>
        <input type="checkbox" id="siteToggle" role="switch">
      </label>
    </section>

    <section class="card">
      <label class="row toggle">
        <span>全局启用</span>
        <input type="checkbox" id="globalToggle" role="switch">
      </label>
    </section>

    <footer id="videos" class="foot">—</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
